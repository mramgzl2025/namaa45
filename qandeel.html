<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#04263f;font-family:'Tajawal',sans-serif;color:#fff}
  #ar{position:fixed;inset:0}
  #ar video{object-fit:cover}
  #start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(circle at 50% 20%,#1f7fbf 0%,#0b4f8a 45%,#04263f 100%)}
  .card{max-width:440px;width:100%;text-align:center}
  .card .icon{font-size:64px;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px)}}
  .card h1{font-size:30px;font-weight:800;margin:10px 0 6px}
  .card .sub{font-size:17px;opacity:.9;margin-bottom:18px}
  .steps{background:rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;text-align:right;font-size:16px;line-height:1.9;margin-bottom:20px}
  .steps b{color:#ffd84d}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:800 19px 'Tajawal',sans-serif;cursor:pointer;margin-bottom:12px}
  .btn.main{background:#ffd84d;color:#0b3a63;box-shadow:0 6px 0 #c9a320}
  .btn.alt{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.4)}
  .btn:active{transform:translateY(3px)}
  #msg{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:12;
    background:rgba(4,38,63,.82);padding:10px 18px;border-radius:30px;font-size:16px;font-weight:700;display:none;white-space:nowrap}
  #msg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ffd84d;margin-left:8px;animation:pl 1s infinite}
  @keyframes pl{50%{opacity:.2}}
  #bar{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:12;display:none;
    background:rgba(4,38,63,.88);border-radius:22px;padding:10px;backdrop-filter:blur(6px)}
  #bar .row{display:flex;align-items:center;gap:8px}
  #bar button{border:0;border-radius:14px;width:52px;height:52px;font-size:24px;font-weight:800;background:#ffd84d;color:#0b3a63;flex:none;cursor:pointer}
  #bar button.play{background:rgba(255,255,255,.18);color:#fff;font-size:20px}
  #bar .ttl{flex:1;text-align:center;font-weight:800;font-size:18px;line-height:1.3}
  #bar .ttl small{display:block;font-size:13px;opacity:.75;font-weight:500}
  #bar .txt{font-size:15px;line-height:1.7;padding:8px 6px 2px;opacity:.95;display:none}
  #bar.open .txt{display:block}
  #err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:#04263f;text-align:center;font-size:18px;line-height:1.8}
</style>

<div id="ar"></div>

<div id="start"><div class="card">
  <div class="icon">🪼</div>
  <h1>الدور الحيوي لقنديل البحر</h1>
  <div class="sub">تجربة واقع معزز – أحياء ١ · اللاسعات</div>
  <div class="steps">
    ١- اطبعي صورة الكتاب أو اعرضيها على شاشة أخرى.<br>
    ٢- اضغطي <b>ابدئي بالكاميرا</b> واسمحي باستخدام الكاميرا.<br>
    ٣- وجّهي الكاميرا على الصورة كاملة… وشاهدي الصفحة البيضاء تمتلئ بالشرح!
  </div>
  <button class="btn main" id="goAR">📷 ابدئي بالكاميرا</button>
  <button class="btn alt" id="goPrev">🖥️ معاينة بدون كاميرا (للسبورة)</button>
</div></div>

const CW = 1024, CH = 1222;
const cv = document.createElement('canvas'); cv.width = CW; cv.height = CH;
const g = cv.getContext('2d');
let stage = 0, stageT0 = 0;

function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrap(text, maxW){
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words){ const tst = line ? line + ' ' + w : w;
    if (g.measureText(tst).width > maxW && line){ lines.push(line); line = w; } else line = tst; }
  if (line) lines.push(line); return lines;
}
const AR_NUM = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

/* رسومات الكائنات */
function medusa(x,y,s,t,col='rgba(120,200,255,'){
  const p = 1 + Math.sin(t*3)*0.08;           // نبض الجرس
  g.save(); g.translate(x,y); g.scale(s,s);
  // لوامس
  g.lineWidth = 3; g.strokeStyle = col+'0.7)';
  for(let i=-4;i<=4;i++){ g.beginPath(); g.moveTo(i*14*p,0);
    for(let k=1;k<=10;k++){ g.lineTo(i*14*p + Math.sin(t*2.5+k*0.6+i)*8, k*16); } g.stroke(); }
  // أذرع فمية
  g.lineWidth = 9; g.strokeStyle = col+'0.55)';
  for(let i=-1;i<=1;i+=2){ g.beginPath(); g.moveTo(i*12,0);
    for(let k=1;k<=6;k++) g.lineTo(i*14+Math.sin(t*2+k)*10, k*18); g.stroke(); }
  // الجرس
  const grd = g.createRadialGradient(0,-40,10,0,-20,90);
  grd.addColorStop(0,col+'0.95)'); grd.addColorStop(1,col+'0.35)');
  g.fillStyle = grd; g.beginPath(); g.ellipse(0,0,80*p,70/p,0,Math.PI,0); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 3; g.stroke();
  g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(-25,-40,18,10,-0.5,0,7); g.fill();
  g.restore();
}
function polypShape(x,y,s,t,h=170){
  g.save(); g.translate(x,y); g.scale(s,s);
  const sway = Math.sin(t*1.5)*6;
  g.fillStyle='rgba(140,210,255,.85)'; g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(-30,0); g.quadraticCurveTo(-18,-h*0.5,-38+sway,-h); g.lineTo(38+sway,-h);
  g.quadraticCurveTo(18,-h*0.5,30,0); g.closePath(); g.fill(); g.stroke();
  g.lineWidth=5; g.strokeStyle='rgba(140,210,255,.9)';
  for(let i=-3;i<=3;i++){ g.beginPath(); g.moveTo(i*11+sway,-h);
    for(let k=1;k<=6;k++) g.lineTo(i*11+sway+i*k*3+Math.sin(t*3+k+i)*5, -h-k*14); g.stroke(); }
  g.restore();
}
function seabed(){ g.fillStyle='#e7cf98'; g.beginPath(); g.moveTo(40,680);
  for(let x=40;x<=984;x+=40) g.lineTo(x,665+Math.sin(x*0.03)*8); g.lineTo(984,700); g.lineTo(40,700); g.fill(); }
function arrow(x1,y1,x2,y2){ g.strokeStyle='#ffd84d'; g.fillStyle='#ffd84d'; g.lineWidth=7;
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  const a=Math.atan2(y2-y1,x2-x1); g.beginPath(); g.moveTo(x2,y2);
  g.lineTo(x2-22*Math.cos(a-0.5),y2-22*Math.sin(a-0.5)); g.lineTo(x2-22*Math.cos(a+0.5),y2-22*Math.sin(a+0.5)); g.fill(); }
function label(txt,x,y,size=34){ g.font=`800 ${size}px Tajawal`; g.textAlign='center'; g.direction='rtl';
  const w=g.measureText(txt).width+26; g.fillStyle='rgba(255,255,255,.95)'; rr(x-w/2,y-size*0.85,w,size*1.35,size*0.6); g.fill();
  g.fillStyle='#0b3a63'; g.fillText(txt,x,y+size*0.25); }

const ANIM = {
  medusa(t){ medusa(512,360+Math.sin(t*1.5)*20,1.6,t); },
  gametes(t){
    medusa(300,280,0.9,t); medusa(724,280,0.9,t,'rgba(160,190,255,');
    label('أنثى',300,215); label('ذكر',724,215);
    for(let i=0;i<9;i++){ const k=((t*0.25+i/9)%1); const x=300+k*190+Math.sin(i*3)*40, y=400+k*180+Math.cos(i)*30;
      g.fillStyle='#ffd23d'; g.beginPath(); g.arc(x,y,13,0,7); g.fill(); g.strokeStyle='#c99a00'; g.lineWidth=2; g.stroke(); }
    for(let i=0;i<14;i++){ const k=((t*0.35+i/14)%1); const x=724-k*190+Math.sin(i*5)*45, y=400+k*180+Math.cos(i*2)*30;
      g.fillStyle='#fff'; g.beginPath(); g.arc(x,y,6,0,7); g.fill(); g.strokeStyle='#fff'; g.lineWidth=2; g.beginPath(); g.moveTo(x+5,y);
      for(let q=1;q<=4;q++) g.lineTo(x+5+q*7,y+Math.sin(t*12+q+i)*5); g.stroke(); }
    label('بويضات',380,650,30); label('حيوانات منوية',650,650,30);
  },
  zygote(t){
    const cyc=(t*0.35)%1, n = cyc<0.3?1:cyc<0.55?2:cyc<0.8?4:8;
    if(cyc<0.3){ const k=cyc/0.3; g.fillStyle='#ffd23d'; g.beginPath(); g.arc(512,430,95,0,7); g.fill();
      g.fillStyle='#fff'; const sx=512+130-k*130; g.beginPath(); g.arc(sx,430-k*20,9,0,7); g.fill();
      label(k<0.95?'إخصاب':'زيجوت',512,615); return; }
    const pos={2:[[-50,0],[50,0]],4:[[-45,-45],[45,-45],[-45,45],[45,45]],8:[[-60,-35],[0,-55],[60,-35],[-60,35],[0,55],[60,35],[-25,0],[25,0]]}[n];
    const r = n==2?55:n==4?45:33;
    g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=3; g.beginPath(); g.arc(512,430,115,0,7); g.stroke();
    for(const [dx,dy] of pos){ g.fillStyle='#ffd23d'; g.beginPath(); g.arc(512+dx,430+dy,r,0,7); g.fill(); g.strokeStyle='#c99a00'; g.stroke(); }
    label('الزيجوت ينقسم: '+AR_NUM(n)+' خلايا',512,615);
  },
  larva(t){
    seabed(); const k=(t*0.18)%1; const x=880-k*640, y=k<0.75? 330+Math.sin(t*4)*25 : 330+(k-0.75)/0.25*300;
    g.save(); g.translate(x,y); g.rotate(k<0.75?Math.sin(t*4)*0.15:-(k-0.75)*5);
    g.fillStyle='rgba(120,220,170,.9)'; g.beginPath(); g.ellipse(0,0,70,36,0,0,7); g.fill(); g.strokeStyle='#fff'; g.lineWidth=3; g.stroke();
    g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=2;
    for(let a=0;a<Math.PI*2;a+=0.25){ const cx=Math.cos(a)*70, cy=Math.sin(a)*36, w=Math.sin(t*20+a*3)*4;
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx*1.22+w,cy*1.35+w); g.stroke(); }
    g.restore(); label('يرقة مهدّبة',512,215);
  },
  polyp(t){ seabed(); const k=Math.min(1,((t*0.3)%1.4)); polypShape(512,672,1.25*Math.max(0.25,k),t); label('بوليب',512,215); },
  bud(t){ seabed(); polypShape(420,672,1.25,t); const k=Math.min(1,(t*0.25)%1.3);
    g.save(); g.translate(470,600); g.rotate(0.9); polypShape(0,0,0.15+k*0.4,t,140); g.restore();
    label('برعم',650,470); arrow(610,490,540,560); },
  strobila(t){ seabed();
    g.fillStyle='rgba(140,210,255,.85)'; g.strokeStyle='#fff'; g.lineWidth=3;
    g.beginPath(); g.moveTo(482,672); g.lineTo(492,560); g.lineTo(532,560); g.lineTo(542,672); g.closePath(); g.fill(); g.stroke();
    const k=(t*0.4)%1;
    for(let i=0;i<6;i++){ const y=545-i*42 - (i==5? k*260:0), a=i==5?1-k:1;
      g.globalAlpha=Math.max(0,a); g.fillStyle='rgba(150,215,255,.95)'; g.beginPath(); g.ellipse(512,y,70+i*2,20,0,0,7); g.fill(); g.stroke();
      for(let q=-3;q<=3;q++){ g.beginPath(); g.moveTo(512+q*20,y+18); g.lineTo(512+q*22,y+30); g.stroke(); } }
    g.globalAlpha=1; label('أقراص',760,420); arrow(720,430,600,450); },
  ephyra(t){ const k=(t*0.15)%1; medusa(512,520-k*240,0.35+k*1.1,t); if(k<0.4){ label('قنديل صغير',512,650); } else label('ينمو إلى ميدوزا بالغة',512,650); },
  cycle(t){
    const pts=[['ميدوزا',512,215],['أمشاج',790,330],['يرقة',790,560],['بوليب',512,660],['أقراص',234,560],['قنديل صغير',234,330]];
    g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=6; g.beginPath(); g.ellipse(512,440,280,220,0,0,7); g.stroke();
    const a=t*0.8; const mx=512+Math.cos(a-Math.PI/2)*280, my=440+Math.sin(a-Math.PI/2)*220;
    g.fillStyle='#ffd84d'; g.beginPath(); g.arc(mx,my,16,0,7); g.fill();
    medusa(512,430,0.7,t);
    pts.forEach(([s,x,y])=>label(s,x,y,32));
    g.font='800 28px Tajawal'; g.fillStyle='#ffd84d'; g.textAlign='center';
    g.fillText('جنسي',680,250); g.fillText('لاجنسي',340,650);
  }
};

function drawPanel(now){
  const t = now/1000, s = STAGES[stage];
  g.clearRect(0,0,CW,CH);
  g.save(); g.direction='rtl';
  // الخلفية
  rr(8,8,CW-16,CH-16,40); g.fillStyle='rgba(240,249,255,0.97)'; g.fill(); g.lineWidth=8; g.strokeStyle='#0b4f8a'; g.stroke();
  // العنوان
  rr(30,30,CW-60,120,30); g.fillStyle='#0b4f8a'; g.fill();
  g.fillStyle='#ffd84d'; g.beginPath(); g.arc(CW-100,90,42,0,7); g.fill();
  g.fillStyle='#0b3a63'; g.font='800 48px Tajawal'; g.textAlign='center'; g.fillText(AR_NUM(stage+1),CW-100,107);
  g.fillStyle='#fff'; g.font='800 54px Tajawal'; g.textAlign='right'; g.fillText(s.t, CW-165, 110);
  // منطقة الرسم
  g.save(); rr(40,170,CW-80,540,30); g.clip();
  const wg=g.createLinearGradient(0,170,0,710); wg.addColorStop(0,'#2a8fd0'); wg.addColorStop(1,'#0b4f8a'); g.fillStyle=wg; g.fillRect(40,170,CW-80,540);
  for(let i=0;i<12;i++){ const bx=(i*97)%900+70, by=700-((t*40+i*60)%540); g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=2; g.beginPath(); g.arc(bx,by,5+i%3*3,0,7); g.stroke(); }
  ANIM[s.a](t - stageT0/1000);
  g.restore();
  // النص
  g.fillStyle='#0b3a63'; g.font='700 46px Tajawal'; g.textAlign='right';
  const lines = wrap(s.x, CW-120); lines.slice(0,6).forEach((l,i)=>g.fillText(l, CW-60, 790+i*66));
  // نقاط التقدم
  const n=STAGES.length, gap=56, x0=CW/2+(n-1)*gap/2;
  for(let i=0;i<n;i++){ g.fillStyle = i===stage?'#ffd84d':'#b9d6ec'; g.beginPath(); g.arc(x0-i*gap,1180,i===stage?16:11,0,7); g.fill(); }
  g.restore();
}

/* ---------- المحتوى ثلاثي الأبعاد ---------- */
let panelTex, panelMesh, rings=[], jelly, contentGroup;
function buildContent(group){
  contentGroup = group;
  panelTex = new THREE.CanvasTexture(cv); panelTex.colorSpace = THREE.SRGBColorSpace; panelTex.anisotropy = 4;
  const pw = 0.436, ph = pw*CH/CW;
  panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(pw,ph), new THREE.MeshBasicMaterial({map:panelTex, transparent:true}));
  const [cx,cy] = P(425,490); panelMesh.position.set(cx,cy,0.01); group.add(panelMesh);

  for(let i=0;i<2;i++){
    const m = new THREE.Mesh(new THREE.RingGeometry(0.026,0.036,48), new THREE.MeshBasicMaterial({color:0xffd84d,transparent:true,depthWrite:false}));
    const m2 = new THREE.Mesh(new THREE.RingGeometry(0.026,0.032,48), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false}));
    m.add(m2); m.visible=false; group.add(m); rings.push(m);
  }

  // قنديل ثلاثي الأبعاد يطفو فوق الكتاب
  jelly = new THREE.Group();
  const bell = new THREE.Mesh(new THREE.SphereGeometry(0.07,40,20,0,Math.PI*2,0,Math.PI/2),
    new THREE.MeshStandardMaterial({color:0x8fd6ff,emissive:0x2a7fbf,emissiveIntensity:0.6,transparent:true,opacity:0.75,side:THREE.DoubleSide,roughness:0.2}));
  jelly.add(bell); jelly.userData.bell = bell;
  const tents=[];
  for(let i=0;i<12;i++){
    const pts=[]; for(let k=0;k<14;k++) pts.push(new THREE.Vector3());
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xbfe8ff,transparent:true,opacity:0.85}));
    line.userData.a = i/12*Math.PI*2; jelly.add(line); tents.push(line);
  }
  jelly.userData.tents = tents;
  jelly.rotation.x = Math.PI/2;           // الجرس للأعلى باتجاه خارج الصفحة
  jelly.position.set(0.02, 0.40, 0.10);
  group.add(jelly);
}
function setStage(i){
  stage = (i+STAGES.length)%STAGES.length; stageT0 = performance.now();
  const s = STAGES[stage];
  rings.forEach((r,k)=>{ const h=s.h[k]; r.visible=!!h; if(h){ const [x,y]=P(h[0],h[1]); r.position.set(x,y,0.012); } });
  document.getElementById('ttl').innerHTML = s.t + '<small>المرحلة ' + AR_NUM(stage+1) + ' من ' + AR_NUM(STAGES.length) + '</small>';
  document.getElementById('txt').textContent = s.x;
}
let lastDraw = 0;
function update(now){
  if (now - lastDraw > 33){ drawPanel(now); panelTex.needsUpdate = true; lastDraw = now; }
  const t = now/1000, since=(now-stageT0)/1000;
  // ظهور اللوحة بنعومة عند تغيير المرحلة
  const e = Math.min(1, since*3); panelMesh.scale.setScalar(0.92+0.08*e); panelMesh.position.z = 0.01 + (1-e)*0.03;
  rings.forEach((r,k)=>{ const q=(t*1.2+k*0.4)%1; r.scale.setScalar(1+q*0.7); r.material.opacity=1-q*0.7; r.children[0].material.opacity=0.9-q*0.6; });
  const show = !!STAGES[stage].j;
  jelly.visible = show;
  if(show){
    const p = 1+Math.sin(t*3)*0.12;
    jelly.userData.bell.scale.set(p,1/p,p);
    jelly.position.z = 0.10 + Math.sin(t*1.5)*0.025;
    jelly.rotation.y = t*0.4;
    jelly.userData.tents.forEach(l=>{
      const a=l.userData.a, pos=l.geometry.attributes.position;
      for(let k=0;k<14;k++){ const rr=0.06*p - k*0.0015;
        pos.setXYZ(k, Math.cos(a)*rr + Math.sin(t*2.5+k*0.5+a)*0.006, -k*0.014, Math.sin(a)*rr + Math.cos(t*2+k*0.5)*0.006); }
      pos.needsUpdate = true; });
  }
}

/* ---------- الواجهة ---------- */
let auto=null;
document.getElementById('next').onclick=()=>{ setStage(stage+1); };
document.getElementById('prev').onclick=()=>{ setStage(stage-1); };
document.getElementById('ttl').onclick=()=>document.getElementById('bar').classList.toggle('open');
document.getElementById('play').onclick=(e)=>{
  if(auto){ clearInterval(auto); auto=null; e.target.textContent='▶'; }
  else { auto=setInterval(()=>setStage(stage+1),9000); e.target.textContent='⏸'; } };
function showErr(h){ const el=document.getElementById('err'); el.innerHTML=h; el.style.display='flex'; }
async function fontsReady(){ try{ await document.fonts.load('800 54px Tajawal'); await document.fonts.load('700 46px Tajawal'); }catch(e){} }
function b64ToBlobURL(b64, type){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return URL.createObjectURL(new Blob([u],{type})); }


async function getTargetURL(){
  const KEY='qandeel-mind-v1';
  try{ const c=localStorage.getItem(KEY); if(c) return b64ToBlobURL(c,'application/octet-stream'); }catch(e){}
  document.getElementById('msgT').textContent='جاري تجهيز الصورة… (مرة واحدة فقط)';
  const { Compiler } = await import('mindar-image');
  const img=new Image(); img.src='data:image/jpeg;base64,'+IMG_B64; await img.decode();
  const comp=new Compiler();
  await comp.compileImageTargets([img],p=>{ document.getElementById('msgT').textContent='جاري تجهيز الصورة… '+AR_NUM(Math.round(p))+'٪'; });
  const buf=await comp.exportData();
  try{ let s=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); localStorage.setItem(KEY,btoa(s)); }catch(e){}
  return URL.createObjectURL(new Blob([buf]));
}

/* وضع الكاميرا */
document.getElementById('goAR').onclick = async ()=>{
  document.getElementById('start').style.display='none';
  const msg=document.getElementById('msg'); msg.style.display='block';
  document.getElementById('msgT').textContent='جاري تشغيل الكاميرا…';
  try{
    await fontsReady();
    const { MindARThree } = await import('mindar-image-three');
    const mind = new MindARThree({ container: document.getElementById('ar'), imageTargetSrc: await getTargetURL(),
      uiScanning:'no', uiLoading:'no', uiError:'no', filterMinCF:0.0001, filterBeta:0.001 });
    const { renderer, scene, camera } = mind;
    scene.add(new THREE.HemisphereLight(0xffffff,0x335577,1.2));
    const d=new THREE.DirectionalLight(0xffffff,1); d.position.set(0,1,2); scene.add(d);
    const anchor = mind.addAnchor(0);
    buildContent(anchor.group); setStage(0);
    anchor.onTargetFound = ()=>{ msg.style.display='none'; };
    anchor.onTargetLost  = ()=>{ document.getElementById('msgT').textContent='وجّهي الكاميرا على صورة الكتاب…'; msg.style.display='block'; };
    await mind.start();
    document.getElementById('msgT').textContent='وجّهي الكاميرا على صورة الكتاب…';
    document.getElementById('bar').style.display='block';
    renderer.setAnimationLoop((now)=>{ update(now ?? performance.now()); renderer.render(scene,camera); });
  }catch(e){
    console.error(e);
    showErr('تعذّر تشغيل الكاميرا 😔<br><br>تأكدي من السماح للمتصفح باستخدام الكاميرا، وأن الرابط يبدأ بـ https.<br><br><button class="btn main" onclick="location.reload()">إعادة المحاولة</button>');
  }
};

/* وضع المعاينة بدون كاميرا */
document.getElementById('goPrev').onclick = async ()=>{
  document.getElementById('start').style.display='none';
  await fontsReady();
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(2,devicePixelRatio)); renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x04263f);
  document.getElementById('ar').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.01, 20);
  scene.add(new THREE.HemisphereLight(0xffffff,0x335577,1.2));
  const d=new THREE.DirectionalLight(0xffffff,1); d.position.set(0,1,2); scene.add(d);
  const book = new THREE.Group(); scene.add(book);
  const img = new Image(); img.src = 'data:image/jpeg;base64,' + IMG_B64; await img.decode();
  const tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
  book.add(new THREE.Mesh(new THREE.PlaneGeometry(1,ASP), new THREE.MeshBasicMaterial({map:tex})));
  buildContent(book); setStage(0);
  let rx=-0.45, ry=0, drag=null;
  const fit=()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    const dist = Math.max(1.25, 1.25/camera.aspect*1.15); camera.position.set(0,0,dist); };
  fit(); addEventListener('resize',fit);
  renderer.domElement.addEventListener('pointerdown',e=>drag=[e.clientX,e.clientY,rx,ry]);
  addEventListener('pointerup',()=>drag=null);
  addEventListener('pointermove',e=>{ if(!drag) return; ry=drag[3]+(e.clientX-drag[0])*0.005; rx=Math.max(-1.1,Math.min(0.2,drag[2]+(e.clientY-drag[1])*0.005)); });
  document.getElementById('bar').style.display='block';
  renderer.setAnimationLoop((now)=>{ book.rotation.set(rx,ry,0); update(now ?? performance.now()); renderer.render(scene,camera); });
};
window.__go = (i)=>setStage(i);
