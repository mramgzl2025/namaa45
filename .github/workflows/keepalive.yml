name: منبه نماء التلقائي

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: تنشيط قاعدة البيانات
        env:
          URL: https://fjvtdpiblvunztvlocvy.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqdnRkcGlibHZ1bnp0dmxvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAxNjQsImV4cCI6MjEwODA4NjE2NH0.xbi6NgVfe54NH7-PClPWLCxP-6yvmlSgFUoVBNS_Nes
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -X POST "$URL/rest/v1/rpc/list_teachers" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          if [ "$code" != "200" ]; then exit 1; fi

      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 40 ]; then
            git config user.name "namaa-keepalive"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "تنشيط تلقائي للمنبه"
            git push
          fi
