<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
</head>
<body>
<title>انضباطي سر تميزي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a bold teal hero band with a live heartbeat line, then bright role cards; app views swap below it. */
:root{
  --bg:#F2F9F7; --surface:#FFFFFF; --surface2:#F7FBFA; --ink:#12302D; --muted:#58716D; --line:#D6E8E3;
  --teal:#0E9C8D; --teal-deep:#0A6F66; --coral:#FF6A55; --sun:#FFB020; --sky:#2F7FEA; --berry:#E0457B; --gold:#C8962A;
  --teal-soft:#DDF4F0; --coral-soft:#FFE7E3; --sun-soft:#FFF2D6; --sky-soft:#E2EEFF; --berry-soft:#FCE3EC;
  --on-accent:#FFFFFF; --shadow:0 10px 30px -14px rgba(10,80,72,.35);
  --display:"Reem Kufi","Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1A19; --surface:#132826; --surface2:#17302D; --ink:#E6F4F1; --muted:#9BB8B2; --line:#24423E;
  --teal:#22C2AF; --teal-deep:#0B5A53; --coral:#FF7E6B; --sun:#FFC24D; --sky:#5C9BFF; --berry:#FF6A9A; --gold:#E2B653;
  --teal-soft:#123B37; --coral-soft:#3A201C; --sun-soft:#3A2E12; --sky-soft:#152A47; --berry-soft:#3A1828;
  --on-accent:#FFFFFF; --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A19; --surface:#132826; --surface2:#17302D; --ink:#E6F4F1; --muted:#9BB8B2; --line:#24423E;
  --teal:#22C2AF; --teal-deep:#0B5A53; --coral:#FF7E6B; --sun:#FFC24D; --sky:#5C9BFF; --berry:#FF6A9A; --gold:#E2B653;
  --teal-soft:#123B37; --coral-soft:#3A201C; --sun-soft:#3A2E12; --sky-soft:#152A47; --berry-soft:#3A1828;
  --on-accent:#FFFFFF; --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--teal-deep);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;padding:0;text-align:right}
.brand .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--sun),var(--coral));display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-size:1.1rem;display:block;line-height:1.2}
.brand small{opacity:.8;font-size:.8rem}
.top-actions{display:flex;gap:8px;align-items:center}
.pill-btn{border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.85rem}
.pill-btn:hover{background:rgba(255,255,255,.2)}

/* hero */
.hero{background:radial-gradient(circle at 12% 20%,rgba(255,176,32,.28),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,106,85,.3),transparent 45%),var(--teal-deep);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.5px,transparent 1.5px);background-size:22px 22px}
.hero .wrap{position:relative;padding-block:34px 46px;display:grid;gap:18px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:700;width:max-content;max-width:100%}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:700}
.hero h1 span{color:var(--sun)}
.hero p.lead{font-size:1.1rem;max-width:58ch;opacity:.92}
.ekg{width:100%;height:56px;display:block}
.ekg path{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:0;animation:beat 3.2s linear infinite}
@keyframes beat{0%{stroke-dashoffset:1200}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-1200}}
@media (prefers-reduced-motion:reduce){.ekg path{animation:none}}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px}
.hero-stats div{background:rgba(255,255,255,.13);border-radius:14px;padding:8px 14px;font-size:.9rem}
.hero-stats b{font-family:var(--display);font-size:1.15rem;color:var(--sun);margin-left:4px}

main{padding-block:28px 40px}
.view{display:grid;gap:22px}

/* icons */
.ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 8px 18px -8px currentColor}
.ic svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:42px;height:42px;border-radius:14px}.ic.sm svg{width:22px;height:22px}
.g-teal{background:linear-gradient(135deg,#19C2AE,#0A7E72)} .g-coral{background:linear-gradient(135deg,#FF8B6B,#F04A4A)}
.g-sun{background:linear-gradient(135deg,#FFCF4A,#FF9A1F)} .g-sky{background:linear-gradient(135deg,#5AA8FF,#2F63E0)}
.g-berry{background:linear-gradient(135deg,#FF77A6,#C92D68)} .g-gold{background:linear-gradient(135deg,#F2CB6B,#B9831C)}

/* role cards */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:-58px;position:relative}
.role{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow);text-align:right;cursor:pointer;transition:transform .2s}
.role:hover{transform:translateY(-3px)}
.role h2{font-size:1.45rem}
.role p{color:var(--muted)}
.role .go{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--teal)}
.role.admin .go{color:var(--berry)}
.role-head{display:flex;gap:14px;align-items:center}

.sec-title{display:flex;align-items:center;gap:10px}
.sec-title h2{font-size:1.4rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.step{background:var(--surface);border-radius:20px;padding:18px;display:grid;gap:10px;border:1px solid var(--line)}
.step .n{font-family:var(--display);font-size:.85rem;color:var(--muted)}
.step h3{font-size:1.1rem}
.step p{color:var(--muted);font-size:.95rem}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px}
.rule p{font-size:.95rem}
.rule b{display:block}
.r1{background:var(--teal-soft)}.r2{background:var(--sun-soft)}.r3{background:var(--sky-soft)}.r4{background:var(--berry-soft)}

/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:grid;gap:16px}
.narrow{max-width:480px;margin-inline:auto;width:100%}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.95rem}
.field .hint{font-size:.82rem;color:var(--muted)}
.inp{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:11px 14px;font-size:1rem;transition:border-color .15s}
.inp:focus{border-color:var(--teal);outline:none}
.inp.big{font-size:1.5rem;letter-spacing:.12em;text-align:center;font-weight:800}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:linear-gradient(135deg,#17B5A3,#0A7E72);color:var(--on-accent)}
.btn.warm{background:linear-gradient(135deg,#FF8B6B,#F04A4A);color:var(--on-accent)}
.btn.berry{background:linear-gradient(135deg,#FF77A6,#C92D68);color:var(--on-accent)}
.btn.ghost{background:var(--surface2);border:2px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.err{color:var(--coral);font-weight:700;font-size:.9rem}
.demo-note{background:var(--sun-soft);border-radius:14px;padding:10px 14px;font-size:.88rem}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.82rem;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-new{background:var(--sky-soft);color:var(--sky)} .s-accepted{background:var(--teal-soft);color:var(--teal)}
.s-rejected{background:var(--coral-soft);color:var(--coral)} .s-more{background:var(--sun-soft);color:#B7740A}
:root[data-theme="dark"] .s-more{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-more{color:var(--sun)}}

/* wizard */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stepper div{border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:.85rem;background:var(--surface2);color:var(--muted);border:2px solid var(--line)}
.stepper div.on{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.stepper div.done{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.days-box{display:flex;align-items:center;gap:12px;background:var(--sky-soft);border-radius:16px;padding:12px 16px}
.days-box b{font-family:var(--display);font-size:1.8rem;color:var(--sky)}
.drop{border:2.5px dashed var(--teal);border-radius:20px;padding:24px;text-align:center;background:var(--teal-soft);cursor:pointer;display:grid;gap:8px;justify-items:center}
.drop.over{background:var(--sun-soft);border-color:var(--sun)}
.preview{display:flex;gap:12px;align-items:center;background:var(--surface2);border-radius:16px;padding:10px;border:1px solid var(--line)}
.preview img{width:88px;height:88px;object-fit:cover;border-radius:12px}
.preview .pdf{width:88px;height:88px;border-radius:12px;display:grid;place-items:center;background:var(--coral-soft);color:var(--coral);font-weight:800;font-family:var(--display)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);padding:12px;border-radius:14px}
.check input{width:20px;height:20px;accent-color:var(--teal);margin-top:4px;flex:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

/* student dashboard */
.hello{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hello h2{font-size:1.5rem}
.meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border-radius:20px;padding:14px 16px;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:1.9rem;line-height:1.2}
.tile span{font-size:.9rem;font-weight:700}
.t1{background:var(--sky-soft)}.t1 b{color:var(--sky)}
.t2{background:var(--teal-soft)}.t2 b{color:var(--teal)}
.t3{background:var(--sun-soft)}.t3 b{color:#C17A08}
.t4{background:var(--coral-soft)}.t4 b{color:var(--coral)}
:root[data-theme="dark"] .t3 b{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t3 b{color:var(--sun)}}
.quote{background:linear-gradient(135deg,var(--teal-soft),var(--sun-soft));border-radius:20px;padding:16px 18px;display:flex;gap:12px;align-items:center;font-weight:700}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.item-top b{font-size:1.02rem}
.meta{color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.note-box{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:26px;display:grid;justify-items:center;gap:10px}

/* success */
.success{text-align:center;display:grid;justify-items:center;gap:12px}
.refcode{font-family:var(--display);font-size:1.6rem;background:var(--sun-soft);border:2px dashed var(--sun);border-radius:16px;padding:8px 22px;direction:ltr;letter-spacing:.06em}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* admin */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .inp{flex:1 1 220px;width:auto}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.adm-item{cursor:pointer;transition:border-color .15s}
.adm-item:hover{border-color:var(--teal)}
.late-tag{background:var(--coral-soft);color:var(--coral);border-radius:8px;padding:0 8px;font-size:.78rem;font-weight:800}
.modal-bg{position:fixed;inset:0;background:rgba(5,25,23,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:24px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.kv div{background:var(--surface2);border-radius:12px;padding:8px 12px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:.78rem}
.kv span{font-weight:700;overflow-wrap:anywhere}
.filebox{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface2);min-height:120px;display:grid;place-items:center}
.filebox img{width:100%;display:block}
.filebox iframe{width:100%;height:520px;border:0}
.decide{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}

footer{border-top:1px solid var(--line);padding-block:20px 28px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;color:var(--muted);font-size:.88rem}
.credit{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#F7DC8E,#D9A63A);color:#3E2A00;border-radius:999px;padding:6px 16px;font-weight:800}
.credit svg{width:18px;height:18px;fill:#3E2A00}
@media (max-width:560px){.hero .wrap{padding-block:24px 40px}.roles{margin-top:-46px}.stepper div{font-size:.75rem}}
</style>

<div id="app">
  <header class="top">
    <div class="wrap">
      <button class="brand" id="homeBtn" type="button" aria-label="الصفحة الرئيسية">
        <span class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6z"/><path d="M7.5 12h2.2l1.3-2.5 2 5 1.3-2.5h2.2"/></svg></span>
        <span><b>انضباطي سر تميزي</b><small id="schoolName">الثانوية الخامسة والأربعون</small></span>
      </button>
      <div class="top-actions" id="topActions"></div>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="wrap">
      <span class="eyebrow">منصة الأعذار الطبية للطالبات</span>
      <h1>انضباطي <span>سر تميزي</span></h1>
      <p class="lead">غبتِ لظرف صحي؟ ارفعي تقريرك الطبي من جوالك في دقيقتين، وتابعي قبول عذرك من وكيلة شؤون الطالبات بدون أوراق ولا انتظار.</p>
      <svg class="ekg" viewBox="0 0 1000 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 H300 l18 -4 12 4 H380 l14 -24 16 46 16 -36 10 14 H560 l12 -6 10 6 H700 l14 -22 16 40 14 -30 10 12 H1000"/></svg>
    </div>
  </section>

  <main class="wrap" id="main"></main>

  <footer>
    <div class="wrap">
      <span>منصة انضباطي · <span id="footSchool">الثانوية الخامسة والأربعون</span></span>
      <span class="credit"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>تصميم أ. مديحه علي العبيدي</span>
    </div>
  </footer>
</div>
<canvas id="confetti" hidden></canvas>

/* ================================================ */

const toDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isSchoolDay = d => d.getDay() >= 0 && d.getDay() <= 4; // الأحد–الخميس
function schoolDays(a, b){
  if(!a || !b) return 0; let d = toDate(a), e = toDate(b), n = 0;
  if(e < d) return 0;
  while(d <= e){ if(isSchoolDay(d)) n++; d.setDate(d.getDate()+1); }
  return n;
}
function lateBy(toStr){
  const d = toDate(toStr); d.setDate(d.getDate()+1);
  while(!isSchoolDay(d)) d.setDate(d.getDate()+1); // يوم العودة
  const today = new Date(); today.setHours(0,0,0,0);
  let n = 0; const c = new Date(d);
  while(c < today){ c.setDate(c.getDate()+1); if(isSchoolDay(c)) n++; }
  return n; // أيام دراسة مضت بعد يوم العودة
}
const fmt = s => { if(!s) return "—"; const d = new Date(s.length<=10 ? s+"T00:00:00" : s);
  try{ return d.toLocaleDateString("ar-SA-u-ca-gregory-nu-arab",{day:"numeric",month:"long",year:"numeric"}); }catch(e){ return s.slice(0,10); } };
const hijri = s => { try{ return new Date(s+"T00:00:00").toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long"}); }catch(e){ return ""; } };
const fmtTime = s => { try{ return new Date(s).toLocaleString("ar-SA-u-ca-gregory",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }catch(e){ return s; } };

      fi.onchange = () => fi.files[0] && take(fi.files[0]);

          late: lateBy(d.to) > CONFIG.DEADLINE_DAYS });

        success(ref);

    };
  }
  render();
}

function readFile(file){
  return new Promise((res, rej) => {
    const isImg = file.type.startsWith("image/"), isPdf = file.type === "application/pdf";
    if(!isImg && !isPdf) return rej(new Error("الملف يجب أن يكون صورة أو PDF."));
    if(isPdf && file.size > 3*1024*1024) return rej(new Error("ملف PDF أكبر من ٣ ميجابايت، صوّري التقرير بدلاً منه."));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("تعذرت قراءة الملف، جربي ملفاً آخر."));
    fr.onload = () => {
      if(isPdf) return res({name:file.name, type:file.type, size:file.size, data:fr.result});
      const img = new Image();
      img.onload = () => { // تصغير الصورة مع الحفاظ على وضوحها
        const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        const data = c.toDataURL("image/jpeg", .78);
        res({name:file.name.replace(/\.\w+$/,"") + ".jpg", type:"image/jpeg", size:Math.round(data.length*.75), data});
      };
      img.onerror = () => rej(new Error("تعذر فتح الصورة. جربي التقاطها مرة أخرى."));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d"); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ["#0E9C8D","#FF6A55","#FFB020","#2F7FEA","#E0457B"];
  const ps = Array.from({length:120}, () => ({x:innerWidth/2, y:innerHeight/3, vx:(Math.random()-.5)*12, vy:Math.random()*-12-2, s:Math.random()*7+4, c:cols[Math.floor(Math.random()*5)], r:Math.random()*6}));
  let t = 0;
  (function f(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(++t < 130) requestAnimationFrame(f); else { x.clearRect(0,0,c.width,c.height); c.hidden = true; } })();
}

  bg.onclick = e => { if(e.target === bg) close(); };
  bg.querySelector("#mClose").onclick = close;
  bg.querySelectorAll("[data-s]").forEach(b => b.onclick = async () => {
    const s = b.dataset.s, note = bg.querySelector("#m-note").value.trim(), er = bg.querySelector("#mErr");
    if((s === "more" || s === "rejected") && !note){ er.textContent = "اكتبي ملاحظة توضح للطالبة السبب."; er.hidden = false; return; }
    b.disabled = true;
    try{ const ok = await api.review(adm.pin, r.id, s, note, adm.name); if(ok === false) throw 0;
      Object.assign(r, {status:s, admin_note:note, reviewed_by:adm.name, reviewed_at:new Date().toISOString()});
      close(); renderAdmin(); toast("تم حفظ القرار: " + STATUS[s].t); }
    catch(e){ b.disabled = false; er.textContent = isLocked(e) ? LOCK_MSG : "لم يُحفظ القرار، حاولي مرة أخرى."; er.hidden = false; }
  });
  try{
    const f = (await api.adminFile(adm.pin, r.id))[0]; const box = bg.querySelector("#fbox");
    if(!f || !f.file_data){ box.innerHTML = `<p style="color:var(--muted)">لا يوجد ملف مرفق.</p>`; return; }
    if((f.file_type||"").startsWith("image/")) box.innerHTML = `<img src="${f.file_data}" alt="التقرير الطبي">`;
    else { let url = f.file_data; try{ const bin = atob(f.file_data.split(",")[1]); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); url = URL.createObjectURL(new Blob([u],{type:"application/pdf"})); }catch(e){}
      box.innerHTML = `<div style="display:grid;gap:10px;width:100%;padding:12px"><iframe src="${url}" title="التقرير الطبي"></iframe><a class="btn ghost" href="${url}" target="_blank" rel="noopener">${ICONS.file} فتح ملف PDF في نافذة جديدة</a></div>`; }
  }catch(e){ bg.querySelector("#fbox").innerHTML = `<p class="err">تعذر فتح التقرير.</p>`; }
}

function exportCSV(){
  const head = ["رقم الطلب","اسم الطالبة","السجل المدني","الصف","الفصل","من","إلى","أيام الدراسة","السبب","الجهة","نوع الجهة","رقم الإجازة","متأخر","الحالة","ملاحظة الإدارة","صاحبة القرار","وقت الرفع"];
  const lines = rows.map(r => [r.ref,r.student_name,"'"+r.national_id,r.grade,r.section,r.from_date,r.to_date,r.school_days,r.reason,r.provider,r.provider_type,r.leave_no,r.late?"نعم":"لا",STATUS[r.status]?.t,r.admin_note,r.reviewed_by,(r.created_at||"").slice(0,16).replace("T"," ")]);
  const csv = "﻿" + [head, ...lines].map(l => l.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `أعذار-انضباطي-${iso(new Date())}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast(DEMO ? "التصدير يعمل بعد نشر المنصة على موقعك" : "تم تجهيز ملف Excel");
}

$("#homeBtn").onclick = () => go(home);
(async function init(){
  main.innerHTML = `<div class="view"><div class="panel"><p>جارٍ تجهيز المنصة…</p></div></div>`;
  if(!CONFIG.SUPABASE_ANON_KEY && CONFIG.KEY_SOURCE){
    try{ const t = await fetch(CONFIG.KEY_SOURCE, {cache:"no-store"}).then(r => r.ok ? r.text() : "");
      const m = t.match(/SUPABASE_ANON_KEY\s*:\s*["']([^"']+)["']/); if(m) CONFIG.SUPABASE_ANON_KEY = m[1]; }catch(e){}
  }
  DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
  home();
})();
</script>
