<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
</head>
<body>
<title>انضباطي سر تميزي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: an emerald clinic band with a live heartbeat, then a phone-first app: top app bar, focused screens, a bottom dock with a raised "new excuse" button. Signature object: the perforated «بطاقة العذر» pass. */
:root{
  --bg:#F1F7F5; --surface:#FFFFFF; --surface2:#F6FAF9; --ink:#10302C; --muted:#5D7571; --line:#DCEAE6;
  --em:#0E9C8D; --em-deep:#0A5E57; --em-night:#073F3B; --gold:#D9A441; --gold-soft:#FBF1DC;
  --coral:#FF6A55; --sky:#3B7CF0; --berry:#D63F7A; --violet:#7A5AE0; --sun:#FFB020;
  --em-soft:#DDF3EF; --coral-soft:#FFE8E4; --sky-soft:#E4EDFF; --berry-soft:#FCE4EE; --violet-soft:#EEE9FD; --sun-soft:#FFF2D9;
  --ok:#14A37F; --warn:#C57A06; --bad:#E0483A; --info:#3B7CF0;
  --on:#FFFFFF; --shadow:0 2px 6px rgba(10,70,62,.05),0 16px 36px -12px rgba(10,70,62,.22);
  --f-display:"El Messiri","Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-brand:"Reem Kufi","El Messiri","Tajawal",Tahoma,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --dock-h:74px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1918; --surface:#122725; --surface2:#16302D; --ink:#E6F3F0; --muted:#9DB9B3; --line:#23423E;
  --em:#25C3AF; --em-deep:#0B524C; --em-night:#062F2C; --gold:#E7BB5E; --gold-soft:#3A2F14;
  --coral:#FF7E6B; --sky:#6A9DFF; --berry:#FF6E9F; --violet:#A28BFF; --sun:#FFC24D;
  --em-soft:#11403A; --coral-soft:#3B211C; --sky-soft:#172B4D; --berry-soft:#3B1828; --violet-soft:#271F45; --sun-soft:#3A2D12;
  --ok:#2FCB9E; --warn:#F0B040; --bad:#FF7466; --info:#6A9DFF;
  --shadow:0 2px 6px rgba(0,0,0,.2),0 16px 36px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1918; --surface:#122725; --surface2:#16302D; --ink:#E6F3F0; --muted:#9DB9B3; --line:#23423E;
  --em:#25C3AF; --em-deep:#0B524C; --em-night:#062F2C; --gold:#E7BB5E; --gold-soft:#3A2F14;
  --coral:#FF7E6B; --sky:#6A9DFF; --berry:#FF6E9F; --violet:#A28BFF; --sun:#FFC24D;
  --em-soft:#11403A; --coral-soft:#3B211C; --sky-soft:#172B4D; --berry-soft:#3B1828; --violet-soft:#271F45; --sun-soft:#3A2D12;
  --ok:#2FCB9E; --warn:#F0B040; --bad:#FF7466; --info:#6A9DFF;
  --shadow:0 2px 6px rgba(0,0,0,.2),0 16px 36px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body.has-dock{padding-bottom:calc(var(--dock-h) + 24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.app{max-width:760px}
.wrap.app.wide{max-width:1040px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- icon badges ---------- */
.badge{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;color:#fff;flex:none;position:relative;isolation:isolate}
.badge::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);z-index:-1}
.badge svg.i{width:27px;height:27px;stroke:#fff}
.badge.sm{width:40px;height:40px;border-radius:13px}.badge.sm svg.i{width:21px;height:21px}
.badge.lg{width:68px;height:68px;border-radius:22px}.badge.lg svg.i{width:34px;height:34px}
.g-em{background:linear-gradient(135deg,#1CC4AE,#0A7C70);box-shadow:0 10px 20px -10px #0A7C70}
.g-coral{background:linear-gradient(135deg,#FF9070,#EE4848);box-shadow:0 10px 20px -10px #EE4848}
.g-sky{background:linear-gradient(135deg,#62A8FF,#2E5FE0);box-shadow:0 10px 20px -10px #2E5FE0}
.g-berry{background:linear-gradient(135deg,#FF7EAA,#C4306A);box-shadow:0 10px 20px -10px #C4306A}
.g-violet{background:linear-gradient(135deg,#A68CFF,#6141D6);box-shadow:0 10px 20px -10px #6141D6}
.g-sun{background:linear-gradient(135deg,#FFD25A,#FF961F);box-shadow:0 10px 20px -10px #FF961F}
.g-gold{background:linear-gradient(135deg,#F5D687,#B98320);box-shadow:0 10px 20px -10px #B98320}
.g-glass{background:rgba(255,255,255,.2);box-shadow:none}

/* ---------- landing (kept) ---------- */
.top{background:var(--em-night);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0;text-align:right}
.brand .mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--sun),var(--coral));display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-brand);font-size:1.12rem;display:block;line-height:1.2}
.brand small{opacity:.8;font-size:.8rem}
.hero{background:radial-gradient(circle at 12% 20%,rgba(255,176,32,.28),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,106,85,.3),transparent 45%),var(--em-deep);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.5px,transparent 1.5px);background-size:22px 22px}
.hero .wrap{position:relative;padding-block:34px 70px;display:grid;gap:18px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:700;width:max-content;max-width:100%}
.hero h1{font-family:var(--f-brand);font-size:clamp(2.3rem,6vw,3.9rem)}
.hero h1 span{color:var(--sun)}
.hero p.lead{font-size:1.1rem;max-width:58ch;opacity:.92}
.ekg{width:100%;height:56px;display:block}
.ekg path{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;animation:beat 3.2s linear infinite}
@keyframes beat{0%{stroke-dashoffset:1200}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-1200}}
@media (prefers-reduced-motion:reduce){.ekg path{animation:none}}
main{padding-block:26px 40px}
.stack{display:grid;gap:20px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:-80px;position:relative}
.role{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow);text-align:right;transition:transform .2s}
.role:hover{transform:translateY(-3px)}
.role h2{font-size:1.5rem}
.role p{color:var(--muted)}
.role .go{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--em)}
.role.admin .go{color:var(--berry)}
.row{display:flex;gap:14px;align-items:center}
.sec-title{display:flex;align-items:center;gap:10px}
.sec-title h2{font-size:1.4rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.step{background:var(--surface);border-radius:22px;padding:18px;display:grid;gap:10px;border:1px solid var(--line)}
.step .n{font-family:var(--f-display);font-size:.85rem;color:var(--muted)}
.step h3{font-size:1.12rem}
.step p{color:var(--muted);font-size:.95rem}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px}
.rule b{display:block}
.r1{background:var(--em-soft)}.r2{background:var(--sun-soft)}.r3{background:var(--sky-soft)}.r4{background:var(--berry-soft)}

/* ---------- app shell ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg,var(--em-night),var(--em-deep) 70%);color:#fff;box-shadow:0 8px 24px -16px rgba(0,0,0,.6)}
body.in-app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--em-night)}
.appbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.appbar .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:#fff;flex:none;background:linear-gradient(135deg,var(--gold),#E9783F);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.avatar svg.i{width:22px;height:22px}
.appbar .who b{display:block;font-size:1rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .who small{display:inline-block;font-size:.74rem;background:rgba(255,255,255,.16);border-radius:999px;padding:0 10px;font-weight:700}
.appbar .mini-brand{font-family:var(--f-brand);font-size:.95rem;opacity:.9;white-space:nowrap}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:8px 12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:.88rem}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.icon-btn svg.i{width:20px;height:20px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.dock nav{pointer-events:auto;max-width:520px;margin:0 auto 12px;height:var(--dock-h);background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 40px -16px rgba(6,47,44,.45);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:center;padding-inline:6px}
.dock button{background:none;border:0;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:.76rem;font-weight:700;padding:6px 2px;border-radius:18px}
.dock button svg.i{width:25px;height:25px}
.dock button[aria-current="page"]{color:var(--em)}
.dock button[aria-current="page"] .dot{opacity:1}
.dock .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0}
.dock .fab{margin-top:-34px;color:var(--coral)}
.dock .fab span.f{width:62px;height:62px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#FF9070,#EE4848);color:#fff;box-shadow:0 14px 26px -10px #EE4848,0 0 0 6px var(--bg)}
.dock .fab span.f svg.i{width:30px;height:30px;stroke:#fff;stroke-width:2.4}
.dock .out{color:var(--bad)}

/* page header band */
.page-head{display:flex;align-items:center;gap:14px;padding:18px;border-radius:26px;color:#fff;position:relative;overflow:hidden}
.page-head::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1.4px,transparent 1.4px);background-size:18px 18px;opacity:.7}
.page-head>*{position:relative}
.page-head h1{font-size:1.45rem}
.page-head p{opacity:.9;font-size:.95rem}
.ph-em{background:linear-gradient(135deg,#0A6A61,#14A894)}
.ph-coral{background:linear-gradient(135deg,#E2463F,#FF8A63)}
.ph-sky{background:linear-gradient(135deg,#2B55C9,#4F96F7)}
.ph-berry{background:linear-gradient(135deg,#9E2357,#E0558A)}
.ph-violet{background:linear-gradient(135deg,#4D30B8,#8E73F0)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
.card.flat{box-shadow:none}
.card h2{font-size:1.2rem}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* welcome */
.welcome{border-radius:28px;padding:22px;color:#fff;background:radial-gradient(circle at 15% 0%,rgba(255,210,90,.35),transparent 45%),linear-gradient(140deg,#073F3B,#0E8C7E 75%);display:grid;gap:14px;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.06);left:-60px;bottom:-90px}
.welcome .hi{font-family:var(--f-display);font-size:1.7rem;line-height:1.3}
.welcome .date{font-size:.9rem;opacity:.85}
.welcome .quote{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.95rem;position:relative}
.welcome .quote svg.i{color:var(--sun)}

.cta{display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:right;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,#EE4848,#FF8A63);box-shadow:0 18px 30px -18px #EE4848}
.cta b{font-family:var(--f-display);font-size:1.25rem;display:block}
.cta span.t{flex:1}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.tile b{font-family:var(--f-display);font-size:1.75rem;line-height:1.1;display:block}
.tile span{font-size:.86rem;font-weight:700;color:var(--muted)}
.tile.t-sky b{color:var(--sky)} .tile.t-em b{color:var(--em)} .tile.t-sun b{color:var(--warn)} .tile.t-coral b{color:var(--coral)} .tile.t-berry b{color:var(--berry)}

/* status tracker */
.track{display:grid;grid-template-columns:repeat(3,1fr);position:relative;padding-top:4px}
.track .st{display:grid;justify-items:center;gap:6px;text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);position:relative}
.track .st::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:4px;background:var(--line);z-index:0}
.track .st:first-child::before{display:none}
.track .st.done::before,.track .st.now::before{background:var(--em)}
.track .st i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:3px solid var(--line);z-index:1;font-style:normal}
.track .st i svg.i{width:18px;height:18px}
.track .st.done i{background:var(--em);border-color:var(--em);color:#fff}
.track .st.now i{background:var(--surface);border-color:var(--em);color:var(--em)}
.track .st.bad i{background:var(--bad);border-color:var(--bad);color:#fff}
.track .st.warn i{background:var(--sun);border-color:var(--sun);color:#fff}
.track .st.bad::before{background:var(--bad)} .track .st.warn::before{background:var(--sun)}

/* pill */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.8rem;white-space:nowrap}
.pill svg.i{width:15px;height:15px;stroke-width:2.6}
.p-new{background:var(--sky-soft);color:var(--info)} .p-accepted{background:var(--em-soft);color:var(--ok)}
.p-rejected{background:var(--coral-soft);color:var(--bad)} .p-more{background:var(--sun-soft);color:var(--warn)}
.p-late{background:var(--coral-soft);color:var(--bad)}

/* excuse rows */
.list{display:grid;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:right;width:100%}
button.ex{transition:border-color .15s,transform .15s}
button.ex:hover{border-color:var(--em);transform:translateY(-1px)}
.ex .body{min-width:0;display:grid;gap:4px}
.ex .top-line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ex .top-line b{font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.86rem}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg.i{width:15px;height:15px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--sun-soft);border-radius:14px;padding:9px 12px;font-size:.9rem}
.note svg.i{width:18px;height:18px;color:var(--warn);margin-top:3px}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:24px 10px;color:var(--muted)}
.empty h2{color:var(--ink)}

/* buttons & fields */
.btn{border:0;border-radius:16px;padding:13px 20px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;transition:filter .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.98)} .btn:hover{filter:brightness(1.05)}
.btn svg.i{width:20px;height:20px}
.b-em{background:linear-gradient(135deg,#17B5A3,#0A7C70);color:#fff}
.b-coral{background:linear-gradient(135deg,#FF8A63,#EE4848);color:#fff}
.b-berry{background:linear-gradient(135deg,#FF77A6,#C4306A);color:#fff}
.b-sun{background:linear-gradient(135deg,#FFC94A,#F08C12);color:#fff}
.b-ghost{background:var(--surface2);border:2px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:grid;gap:7px}
.field label,.lbl{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:8px}
.field label svg.i,.lbl svg.i{width:19px;height:19px;color:var(--em)}
.hint{font-size:.82rem;color:var(--muted)}
.inp{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:16px;padding:12px 14px;font-size:1rem;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--em);background:var(--surface);outline:none}
.inp.big{font-size:1.6rem;letter-spacing:.14em;text-align:center;font-weight:800;font-family:var(--f-display)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.grid2 .wide{grid-column:1/-1}
.err{display:flex;gap:8px;align-items:center;color:var(--bad);font-weight:700;font-size:.92rem;background:var(--coral-soft);border-radius:14px;padding:10px 12px}
.err svg.i{width:19px;height:19px}
.demo{display:flex;gap:10px;align-items:center;background:var(--sun-soft);border-radius:16px;padding:10px 14px;font-size:.88rem}
.demo svg.i{color:var(--warn)}

/* login */
.login{max-width:460px;margin-inline:auto;width:100%}
.login .card{padding:24px}
.top-icon{display:grid;justify-items:center;gap:10px;text-align:center;margin-bottom:4px}

/* wizard */
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.progress .pg{display:grid;gap:6px;justify-items:center;text-align:center;font-size:.8rem;font-weight:800;color:var(--muted)}
.progress .bar{height:7px;width:100%;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em),var(--gold));border-radius:99px;transition:width .4s}
.progress .pg.done .bar i,.progress .pg.on .bar i{width:100%}
.progress .pg.on{color:var(--ink)}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.reason{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:12px 6px;display:grid;justify-items:center;gap:8px;font-weight:800;font-size:.88rem;text-align:center;transition:border-color .15s,transform .15s}
.reason:hover{transform:translateY(-2px)}
.reason[aria-pressed="true"]{border-color:var(--em);background:var(--em-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--em) 25%,transparent)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.dates{grid-template-columns:1fr}}

/* ---------- تخزين الجهاز (تذكر الدخول 7 أيام) ---------- */
const store = {
  get(k){ try{ const v = JSON.parse(localStorage.getItem("anz_"+k)); if(!v) return null; if(v.exp && v.exp < Date.now()){ localStorage.removeItem("anz_"+k); return null; } return v.val; }catch(e){ return null; } },
  set(k,val,days){ try{ localStorage.setItem("anz_"+k, JSON.stringify({val, exp: days ? Date.now()+days*864e5 : 0})); }catch(e){} },
  del(k){ try{ localStorage.removeItem("anz_"+k); }catch(e){} }

/* ---------- التواريخ ---------- */
const toDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isSchoolDay = d => d.getDay() >= 0 && d.getDay() <= 4; // الأحد–الخميس
function schoolDays(a, b){
  if(!a || !b) return 0; let d = toDate(a), e = toDate(b), n = 0;
  if(e < d) return 0;
  while(d <= e){ if(isSchoolDay(d)) n++; d.setDate(d.getDate()+1); }
  return n;
}
function lateBy(toStr){
  const d = toDate(toStr); d.setDate(d.getDate()+1);
  while(!isSchoolDay(d)) d.setDate(d.getDate()+1);
  const today = new Date(); today.setHours(0,0,0,0);
  let n = 0; const c = new Date(d);
  while(c < today){ c.setDate(c.getDate()+1); if(isSchoolDay(c)) n++; }

function sheet(html){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  bg.onclick = e => { if(e.target === bg) close(); };
  bg.querySelector(".close").onclick = close;
  bg.querySelector(".close").focus();
  return {bg, close};
}

function readFile(file){
  return new Promise((res, rej) => {
    const isImg = file.type.startsWith("image/"), isPdf = file.type === "application/pdf";
    if(!isImg && !isPdf) return rej(new Error("الملف يجب أن يكون صورة أو PDF."));
    if(isPdf && file.size > 3*1024*1024) return rej(new Error("ملف PDF أكبر من ٣ ميجابايت، صوّري التقرير بدلاً منه."));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("تعذرت قراءة الملف، جربي ملفاً آخر."));
    fr.onload = () => {
      if(isPdf) return res({name:file.name, type:file.type, size:file.size, data:fr.result});
      const img = new Image();
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        const data = c.toDataURL("image/jpeg", .78);
        res({name:file.name.replace(/\.\w+$/,"") + ".jpg", type:"image/jpeg", size:Math.round(data.length*.75), data});
      };
      img.onerror = () => rej(new Error("تعذر فتح الصورة. جربي التقاطها مرة أخرى."));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d"); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ["#0E9C8D","#FF6A55","#FFB020","#3B7CF0","#D63F7A","#D9A441"];
  const ps = Array.from({length:130}, () => ({x:innerWidth/2, y:innerHeight/3, vx:(Math.random()-.5)*13, vy:Math.random()*-13-2, s:Math.random()*7+4, c:cols[Math.floor(Math.random()*cols.length)], r:Math.random()*6}));
  let t = 0;
  (function f(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(++t < 130) requestAnimationFrame(f); else { x.clearRect(0,0,c.width,c.height); c.hidden = true; } })();
}

      <div class="tile t-sun">${B("alert","g-sun","sm")}<div><b class="num">${n("more")}</b><span>مطلوب استكمال</span></div></div>
      <div class="tile t-em">${B("check","g-em","sm")}<div><b class="num">${n("accepted")}</b><span>مقبولة</span></div></div>
      <div class="tile t-berry">${B("calendar","g-berry","sm")}<div><b class="num">${week}</b><span>هذا الأسبوع</span></div></div>
    </div>
    <div class="search">${I("search")}<input class="inp" id="q" placeholder="ابحثي بالاسم أو السجل المدني أو رقم الطلب" value="${esc(q)}" aria-label="بحث"></div>
    <div class="chips" id="tabs" role="toolbar" aria-label="تصفية الأعذار">${tabs.map(([k,t]) => `<button class="fchip k-${k}" type="button" aria-pressed="${k===filter}" data-k="${k}">${t}<span class="c num">${k==="all"?rows.length:n(k)}</span></button>`).join("")}</div>
    <div class="adm-grid">${list.length ? list.map(r => { const R = reasonOf(r.reason); return `
      <button class="ex" type="button" data-id="${esc(r.id)}">
        <span class="initial ${GRADE_G[r.grade] || "g-em"}">${esc((r.student_name||"ط").slice(0,1))}</span>
        <div class="body">
          <div class="top-line"><b>${esc(r.student_name)}</b>${pill(r.status)}</div>
          <div class="meta"><span>${I("student")}${esc(r.grade)} / ${esc(r.section)}</span><span style="color:${R.c}">${I(R.i)}${esc(r.reason)}</span></div>
          <div class="meta"><span>${I("calendar")}${range(r.from_date, r.to_date)}</span><span class="num">${r.school_days} يوم</span>${r.late ? `<span class="pill p-late">${I("clock")}متأخر</span>` : ""}</div>
          <div class="meta"><span>${I("upload")}وصل ${fmtTime(r.created_at)}</span>${r.reviewed_by ? `<span>${I("pen")}${esc(r.reviewed_by)}</span>` : ""}</div>
        </div>
      </button>`; }).join("") : `<div class="card" style="grid-column:1/-1"><div class="empty">${B("checkc","g-em","lg")}<h2>القسم فارغ</h2><p>لا توجد أعذار هنا الآن.</p></div></div>`}</div>
  </div>`;
  const qi = $("#q"); qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; renderAdmin(); const n2 = $("#q"); n2.focus(); n2.setSelectionRange(pos,pos); };
  $("#tabs").onclick = e => { const b = e.target.closest(".fchip"); if(b){ filter = b.dataset.k; renderAdmin(); } };
  $$(".ex[data-id]").forEach(el => el.onclick = () => openCase(el.dataset.id));
}

async function openCase(id){
  const r = rows.find(x => x.id === id); if(!r) return;
  const R = reasonOf(r.reason);
  const {bg, close} = sheet(`
    <div class="sh-head"><span class="initial sm" style="background:rgba(255,255,255,.2)">${esc((r.student_name||"ط").slice(0,1))}</span><h2>${esc(r.student_name)}</h2><button class="close" type="button" aria-label="إغلاق">${I("x")}</button></div>
    <div class="sh-body">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${pill(r.status)}${r.late ? `<span class="pill p-late">${I("clock")}قُدّم متأخراً</span>` : ""}</div>
      <div class="pass">
        <div class="ph">${B(R.i, R.g, "")}<div><b>${esc(r.reason)}</b><small>رقم الطلب <span class="ref num">${esc(r.ref)}</span></small></div></div>
        <div class="perf"><b></b></div>
        <div class="pb">
          <div><small>السجل المدني</small><span class="num" dir="ltr">${esc(r.national_id)}</span></div>
          <div><small>الصف / الفصل</small><span>${esc(r.grade)} / ${esc(r.section)}</span></div>
          <div class="full"><small>مدة الغياب</small><span>${range(r.from_date, r.to_date)} · ${r.school_days} يوم دراسي</span></div>
          <div><small>الجهة الطبية</small><span>${esc(r.provider)} (${esc(r.provider_type)})</span></div>
          <div><small>رقم الإجازة (صحة)</small><span dir="ltr">${esc(r.leave_no) || "—"}</span></div>
          <div class="full"><small>وقت الرفع</small><span>${fmtTime(r.created_at)}</span></div>
        </div>
      </div>
      ${r.note ? `<div class="note">${I("pen")}<span><b>ملاحظة الطالبة:</b> ${esc(r.note)}</span></div>` : ""}
      ${r.leave_no ? `<a class="btn b-ghost" href="https://www.seha.sa" target="_blank" rel="noopener">${I("search")} التحقق من الإجازة في منصة صحة</a>` : ""}
      <span class="lbl">${I("file")} التقرير الطبي</span>
      <div class="filebox" id="fbox"><p class="muted">جارٍ فتح التقرير…</p></div>
      <div class="card flat">
        <div class="field"><label for="m-note">${I("pen")} ملاحظة للطالبة</label><textarea class="inp" id="m-note" rows="2" placeholder="مثال: الصورة غير واضحة، أعيدي الرفع">${esc(r.admin_note)}</textarea><span class="hint">مطلوبة عند «طلب استكمال» أو «عدم القبول».</span></div>
        <div class="decide">
          <button class="btn b-em" data-s="accepted" type="button">${I("checkc")} قبول العذر</button>
          <button class="btn b-sun" data-s="more" type="button">${I("alert")} طلب استكمال</button>
          <button class="btn b-coral" data-s="rejected" type="button">${I("x")} عدم القبول</button>
        </div>
        ${errBox("mErr")}
      </div>
    </div>`);
  bg.querySelectorAll("[data-s]").forEach(b => b.onclick = async () => {
    const s = b.dataset.s, note = bg.querySelector("#m-note").value.trim(), er = bg.querySelector("#mErr");
    if((s === "more" || s === "rejected") && !note){ showErr(er, "اكتبي ملاحظة توضح للطالبة السبب."); return; }
    b.disabled = true;
    try{ const ok = await api.review(adm.pin, r.id, s, note, adm.name); if(ok === false) throw 0;
      Object.assign(r, {status:s, admin_note:note, reviewed_by:adm.name, reviewed_at:new Date().toISOString()});
      close(); renderAdmin(); toast("تم حفظ القرار: " + STATUS[s].t); }
    catch(e){ b.disabled = false; showErr(er, isLocked(e) ? LOCK_MSG : "لم يُحفظ القرار، حاولي مرة أخرى."); }
  });
  try{
    const f = (await api.adminFile(adm.pin, r.id))[0]; const box = bg.querySelector("#fbox");
    if(!f || !f.file_data){ box.innerHTML = `<p class="muted">لا يوجد ملف مرفق.</p>`; return; }
    if((f.file_type||"").startsWith("image/")) box.innerHTML = `<img src="${f.file_data}" alt="التقرير الطبي">`;
    else { let url = f.file_data; try{ const bin = atob(f.file_data.split(",")[1]); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); url = URL.createObjectURL(new Blob([u],{type:"application/pdf"})); }catch(e){}
      box.innerHTML = `<div style="display:grid;gap:10px;width:100%;padding:12px"><iframe src="${url}" title="التقرير الطبي"></iframe><a class="btn b-ghost" href="${url}" target="_blank" rel="noopener">${I("file")} فتح ملف PDF في نافذة جديدة</a></div>`; }
  }catch(e){ bg.querySelector("#fbox").innerHTML = `<div class="err" style="margin:12px">${I("alert")}<span>تعذر فتح التقرير.</span></div>`; }
}

async function adminReport(){
  adminShell("rep");
  main.innerHTML = loading("جارٍ تجهيز الإحصاء…");
  await loadAll();
  const total = rows.length;
  const byReason = REASONS.map(R => ({R, n: rows.filter(r => reasonOf(r.reason).k === R.k).length})).filter(x => x.n).sort((a,b) => b.n - a.n);
  const byGrade = GRADES.map(g => ({g, n: rows.filter(r => r.grade === g).length, d: rows.filter(r => r.grade === g && r.status !== "rejected").reduce((s,r) => s + (r.school_days||0), 0)}));
  const maxR = Math.max(1, ...byReason.map(x => x.n)), maxG = Math.max(1, ...byGrade.map(x => x.n));
  const late = rows.filter(r => r.late).length;
  const acc = rows.filter(r => r.status === "accepted").length;
  const decided = rows.filter(r => r.status !== "new").length;
  const daysAll = rows.filter(r => r.status !== "rejected").reduce((s,r)=>s+(r.school_days||0),0);
  main.innerHTML = `
  <div class="stack">
    ${demoNote()}
    <div class="page-head ph-violet">${B("chart","g-glass","")}<div><h1>الإحصاء</h1><p>${total} عذر مسجل حتى اليوم</p></div></div>
    <div class="tiles four">
      <div class="tile t-em">${B("check","g-em","sm")}<div><b class="num">${decided ? Math.round(acc/decided*100) : 0}٪</b><span>نسبة القبول</span></div></div>
      <div class="tile t-coral">${B("clock","g-coral","sm")}<div><b class="num">${late}</b><span>قُدّمت متأخرة</span></div></div>
      <div class="tile t-sky">${B("calendar","g-sky","sm")}<div><b class="num">${daysAll}</b><span>أيام غياب بعذر</span></div></div>
      <div class="tile t-berry">${B("hash","g-berry","sm")}<div><b class="num">${rows.filter(r => r.leave_no).length}</b><span>بإجازة من «صحة»</span></div></div>
    </div>
    <div class="card"><h2>الأعذار حسب السبب</h2>
      ${byReason.length ? `<div class="bars">${byReason.map(x => `<div class="barrow"><span class="lb">${B(x.R.i, x.R.g, "sm")}${x.R.k}</span><span class="track2"><i style="width:${x.n/maxR*100}%;background:${x.R.c}"></i></span><b class="num">${x.n}</b></div>`).join("")}</div>` : `<p class="muted">تظهر هنا الأسباب عند وصول أول عذر.</p>`}
    </div>
    <div class="card"><h2>الأعذار حسب الصف</h2>
      <div class="bars">${byGrade.map(x => `<div class="barrow"><span class="lb"><span class="initial sm ${GRADE_G[x.g]}">${GRADE_N[x.g]}</span>${x.g}</span><span class="track2"><i style="width:${x.n/maxG*100}%;background:linear-gradient(90deg,var(--em),var(--gold))"></i></span><b class="num">${x.n}</b></div>`).join("")}</div>
      <p class="hint">أيام الغياب بعذر: ${byGrade.map(x => `${x.g} ${x.d}`).join("، ")}.</p>
    </div>
    <div class="card">
      <div class="row">${B("download","g-gold","")}<div><h2>تصدير إلى Excel</h2><p class="muted">ملف بكل الأعذار وقراراتها لحفظه أو مشاركته.</p></div></div>
      <button class="btn b-em block" id="csv" type="button">${I("download")} تحميل الملف</button>
    </div>
  </div>`;
  $("#csv").onclick = exportCSV;
}

function exportCSV(){
  const head = ["رقم الطلب","اسم الطالبة","السجل المدني","الصف","الفصل","من","إلى","أيام الدراسة","السبب","الجهة","نوع الجهة","رقم الإجازة","متأخر","الحالة","ملاحظة الإدارة","صاحبة القرار","وقت الرفع"];
  const lines = rows.map(r => [r.ref,r.student_name,"'"+r.national_id,r.grade,r.section,r.from_date,r.to_date,r.school_days,r.reason,r.provider,r.provider_type,r.leave_no,r.late?"نعم":"لا",STATUS[r.status]?.t,r.admin_note,r.reviewed_by,(r.created_at||"").slice(0,16).replace("T"," ")]);
  const csv = "﻿" + [head, ...lines].map(l => l.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `أعذار-انضباطي-${iso(new Date())}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast(DEMO ? "التصدير يعمل على موقع المدرسة" : "تم تجهيز ملف Excel");
}

$("#homeBtn").onclick = () => { toTop(); home(); };
(async function init(){
  main.innerHTML = loading("جارٍ تجهيز المنصة…");
  if(!CONFIG.SUPABASE_ANON_KEY && CONFIG.KEY_SOURCE){
    try{ const t = await fetch(CONFIG.KEY_SOURCE, {cache:"no-store"}).then(r => r.ok ? r.text() : "");
      const m = t.match(/SUPABASE_ANON_KEY\s*:\s*["']([^"']+)["']/); if(m) CONFIG.SUPABASE_ANON_KEY = m[1]; }catch(e){}
  }
  DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
  home();
})();
</script>
